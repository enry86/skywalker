[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starwalker"
version = "0.1.0"
description = "StarWalker"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enrico" }]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
]

[project.scripts]
starwalker = "starwalker.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/example/starwalker"

[tool.hatch.build.targets.wheel]
packages = ["src/starwalker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
